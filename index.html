<title>Sushi bar Ordering</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: one narrow column of large tap targets; sheets shown as monospace text blocks that staff copy into chat. */
:root{
  --bg:#f1f3f5; --surface:#ffffff; --ink:#18202c; --muted:#5a6577; --line:#d6dbe3;
  --accent:#1d4d7a; --accent-ink:#ffffff; --tint:#e6eef6; --warn:#a8501c; --ok:#2b7a4b; --bad:#b3261e;
  --display:"Zen Kaku Gothic New","Noto Sans Myanmar","Noto Sans Devanagari","Noto Sans SC","Hiragino Sans","Noto Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --surface:#19202a; --ink:#e7ebf1; --muted:#9aa5b6; --line:#2b3441;
    --accent:#86b6e6; --accent-ink:#0e1824; --tint:#1e2a3a; --warn:#e0925a; --ok:#6fc193; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#19202a; --ink:#e7ebf1; --muted:#9aa5b6; --line:#2b3441;
  --accent:#86b6e6; --accent-ink:#0e1824; --tint:#1e2a3a; --warn:#e0925a; --ok:#6fc193; --bad:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--display); font-size:16px; line-height:1.5;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{min-height:36px;padding:6px 12px;font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.badge.edit{color:var(--ok);border-color:var(--ok)}
h1{font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:clamp(22px,5.5vw,28px);line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:15px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;padding:16px 18px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;
  transition:border-color .15s, background .15s;
}
.tile:hover{border-color:var(--accent);background:var(--tint)}
.tile .t{font-size:19px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile .go{font-size:20px;color:var(--accent);flex:none}
.tile.compact{min-height:64px;padding:12px 16px}
.tile.compact .t{font-size:17px}
.tile .pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 8px;flex:none}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.crumbs a{color:var(--accent);font-weight:700;padding:6px 0}
.crumbs a:hover{text-decoration:underline}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.sheet-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-bar:not(.nostick){position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--surface);border-radius:10px 10px 0 0}
.sheet-bar .note{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{
  font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:8px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.btnlink{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;text-decoration:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input.qty,textarea.txt{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
#bgfix{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none}
pre.txt,textarea.txt{
  display:block;width:100%;margin:0;padding:16px;border:0;background:transparent;color:var(--ink);
  font-family:var(--mono);font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;
  user-select:text;-webkit-user-select:text;
}
textarea.txt{font-size:16px;min-height:60vh;resize:vertical;border-radius:0 0 10px 10px}
textarea.txt:focus-visible{outline-offset:-3px}
.status{font-size:14px;color:var(--muted);min-height:20px}
.status.err{color:var(--warn)}
.hint{font-size:14px;color:var(--muted);margin:0;padding:12px 14px;background:var(--tint);border-radius:8px}
.req{display:flex;flex-direction:column;gap:8px;align-items:flex-start}


.h3{font-size:18px;margin:0;font-weight:700}
.panel{overflow:visible;overflow:clip}
.grp{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--tint);padding:8px 14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.frow .n,.orow .n{overflow-wrap:anywhere;min-width:0}
.hero{background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bgbar{display:flex;gap:8px;flex-wrap:wrap}
.frow.multi{grid-template-columns:minmax(0,1fr)}
.frow.multi .f{justify-content:flex-start;flex-wrap:wrap}
.frow .f{display:flex;align-items:center;gap:8px}
.frow .u{min-width:44px;font-size:13px;color:var(--muted)}
input.qty{font-family:var(--mono);font-size:16px;width:92px;min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
input.qty:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 92px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.orow .c{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:14px}
.orow.ohead{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-top:0}
.ord{font-weight:700;color:var(--accent)}
.ord.zero{color:var(--muted);font-weight:500}
.panel .hint{border-radius:0}
@media (max-width:520px){
  .orow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .orow .n{grid-column:1/-1}
  .orow .c{text-align:left}
  .orow .c::before{content:attr(data-label);display:block;font-family:var(--display);font-size:11px;color:var(--muted)}
  .orow.ohead{display:none}
}

.need{color:var(--bad);font-weight:700}
.tag{display:none;font-size:11px;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.frow.low .tag{display:inline-block}
.frow.low .n{color:var(--bad);font-weight:700}
input.qty.low{border-color:var(--bad);color:var(--bad)}
.ro{font-family:var(--mono);font-size:14px;text-align:right;min-width:44px}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}

  function detectLang(){
    try { var v = localStorage.getItem('pngLang'); if (v && T.title[v]) return v; } catch(e){}
    var n = ((navigator.language || 'en') + '').toLowerCase();
    if (n.indexOf('my') === 0) return 'my';
    if (n.indexOf('ne') === 0) return 'ne';
    if (n.indexOf('zh') === 0) return 'zh';
    return 'en';

  function dayLabel(d){ var i = DAYS.indexOf(d); if (i < 0) return d; var o = S.tx['day' + i] && S.tx['day' + i][ctx.lang]; return o || DAYT[ctx.lang][i]; }

  function el(tag, props){
    var n = document.createElement(tag);
    props = props || {};
    for (var k in props){
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), props[k]);
      else n.setAttribute(k, props[k]);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null) continue;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  }
  function slug(s){ return s.toLowerCase().replace(/\s+/g,'-'); }
  function tile(href, title, sub, compact, pill){

  /* ---------- saving ---------- */
  function buildDoc(){
    var clone = document.body.cloneNode(true);
    var ids = {app:1, state:1, main:1};
    Array.prototype.slice.call(clone.children).forEach(function(c){
      var ok = /^(TITLE|META|STYLE|LINK)$/.test(c.tagName) || ids[c.id];
      if (!ok) clone.removeChild(c);
    });
    clone.querySelector('#app').replaceChildren();
    clone.querySelector('#state').textContent = JSON.stringify(R).replace(/</g,'\\u003c');
    var hs = document.head.querySelector('style');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      (hs ? hs.textContent : '') + '</style></head><body>' + clone.innerHTML + '</body></html>';
  }
  function save(apply, undo){
    ctx.status = 'Saving…'; ctx.err = false; apply(); render();
    var a = ctx.artifact;
    if (!a){ undo(); ctx.status = 'Saving is not available here.'; ctx.err = true; render(); return; }
    a.publish(buildDoc()).then(function(){
      ctx.editing = false; ctx.status = t('saved'); render();
    }, function(e){
      undo();
      var code = e && e.code;
      if (code === 'conflict') ctx.status = 'Someone else saved first. The page is reloading with their version.';
      else if (code === 'not_writer' || code === 'not_granted') { ctx.canEdit = false; ctx.editing = false; ctx.status = 'You do not have permission to edit.'; }
      else ctx.status = 'Could not save. Try again in a moment.';
      ctx.err = true; render();
    });
  }

  /* ---------- copy ---------- */
  function selectNode(n){
    var r = document.createRange(); r.selectNodeContents(n);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    var ok = false;
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return ok;
  }
  function copyFrom(text, pre, btn){
    var old = btn.textContent;
    var done = function(msg, ms){ btn.textContent = msg; setTimeout(function(){ btn.textContent = old; }, ms || 1600); };
    if (legacyCopy(text)){
      done(t('copied'));
      try { navigator.clipboard.writeText(text).catch(function(){}); } catch(e){}
      return;
    }
    var settled = false;
    var fail = function(){ if (settled) return; settled = true; selectNode(pre); done(t('selected'), 5000); };
    var timer = setTimeout(fail, 900);
    try {
      navigator.clipboard.writeText(text).then(function(){
        if (settled) return; settled = true; clearTimeout(timer); done(t('copied'));
      }, function(){ clearTimeout(timer); fail(); });
    } catch(e){ clearTimeout(timer); fail(); }
  }

  /* ---------- request edit ---------- */
  function requestBox(anchor){
    var wrap = el('div', {class:'req'});
    var msg = el('p', {class:'hint', hidden:'', text:''});
    var b = el('button', {type:'button', text:t('request'), onclick:function(){
      if (ctx.comments){
        ctx.comments.openComposer({element:anchor}).then(function(r){
          msg.hidden = false;
          msg.textContent = (r && r.opened === false)
            ? 'Tap the button again to open the comment box.'
            : 'Write your request in the comment box. The owner will see it.';
        }, function(){
          msg.hidden = false; msg.textContent = t('reqnone');
        });
      } else {
        msg.hidden = false; msg.textContent = t('reqnone');
      }
    }});
    wrap.appendChild(b); wrap.appendChild(msg);
    return wrap;
  }

  /* ---------- views ---------- */
  function sheetView(path, title, getText, setText, viewText){
    var shown = viewText || getText;
    var text = getText();
    var box = el('div', {class:'sheet'});
    var bar = el('div', {class:'sheet-bar'});
    var pre;
    if (ctx.editing && ctx.canEdit){
      var ta = el('textarea', {class:'txt', id:'editor', spellcheck:'false', 'aria-label':t('edit') + ' ' + title});
      ta.value = text;
      var saveBtn = el('button', {type:'button', class:'primary', text:t('save'), onclick:function(){
        var next = ta.value, prev = getText();
        if (next === prev){ ctx.editing = false; render(); return; }
        saveBtn.disabled = true;
        save(function(){ setText(next); }, function(){ setText(prev); });
      }});
      var cancel = el('button', {type:'button', text:t('cancel'), onclick:function(){ ctx.editing = false; ctx.status = ''; render(); }});
      bar.appendChild(el('span', {class:'note', text:t('editing')}));
      bar.appendChild(el('div', {class:'btns'}, cancel, saveBtn));
      box.appendChild(bar); box.appendChild(ta);
    } else {
      pre = el('pre', {class:'txt', id:'sheet-text', text:shown()});
      var copy = el('button', {type:'button', class:'primary', text:t('copy'), onclick:function(){ copyFrom(shown(), pre, copy); }});
      var onlyEdit = /^(minmax|sch)/.test(path);
      var btns = el('div', {class:'btns'});
      if (!onlyEdit){ btns.appendChild(copy); btns.appendChild(shareTextBtn(shown, (path === 'order' || path === 'itemsorder') ? 'sharetext' : 'sendbal')); }
      if (ctx.canEdit) btns.appendChild(el('button', {type:'button', text:t('edit'), onclick:function(){ ctx.editing = true; ctx.status = ''; render(); }}));
      bar.appendChild(el('span', {class:'note', text: ctx.canEdit ? t('savedall') : t('readonly')}));
      bar.appendChild(btns);
      box.appendChild(bar); box.appendChild(pre);
    }
    var out = [box];
    if (!ctx.canEdit) out.push(requestBox(box));
    return out;
  }


  /* ---------- auto order: Order = Min-Max - Balance ---------- */
  var SUPLIST = ['XENKA','FOOTAH','LHS','TOHO','SENRI','BMG','GST','FOODAY','UGS','WAGYU','CENTRALKITCHEN','OUTLET'];
  var KEYALIAS = {
    'SENRI|akagai':'SENRI|frozenakagai',
    'SENRI|ohbaleavespcs':'SENRI|ohbaleaf100pcs',
    'SENRI|mizkanponbottlezu':'SENRI|mizkanponzusauce',
    'SENRI|saikyomiso1kg':'SENRI|saikyomiso',
    'CENTRALKITCHEN|wasabidressing':'CENTRALKITCHEN|wasabidressingsauce'
  };
  var ITEM_RE = /^(\s*"?\s*\d+\s*[\)\.]\s*)(.*?)(\s*:\s*)(.*)$/;
  ctx.orderDay = (new Date().getDay() + 6) % 7;
  function lsSuffix(){ return !CUR.name || CUR.name === 'PNG' ? '' : '_' + CUR.name; }
  var BAL = {};
  function saveBal(){ try { localStorage.setItem('pngBal' + lsSuffix(), JSON.stringify(BAL)); } catch(e){} }
  function canon(name){
    return name.toLowerCase().replace(/\([^)]*\)/g,'').replace(/konbu/g,'kombu').replace(/[^a-z0-9]/g,'');
  }
  function headerOf(line){
    var L = line.toUpperCase().replace(/[^A-Z]/g,'');
    if (!L) return '';
    for (var i = 0; i < SUPLIST.length; i++){
      var sp = SUPLIST[i];
      if (L.indexOf(sp) === 0 && L.length <= sp.length + 3) return sp;
    }
    return '';
  }
  function supLabel(sp){ return sp === 'CENTRALKITCHEN' ? 'CENTRAL KITCHEN' : (sp === 'OUTLET' ? 'Outlet' : sp); }
  function scan(text){
    var sup = '', recs = [];
    String(text).split('\n').forEach(function(line){
      var m = line.match(ITEM_RE);
      if (m){
        var rest = m[4].replace(/"+\s*$/,'').trim();
        recs.push({line:line, sup:sup, item:{prefix:m[1], name:m[2], colon:m[3].replace(/\s+$/,''), rest:rest, key:sup + '|' + canon(m[2])}});
      } else {
        var h = headerOf(line); if (h) sup = h;
        recs.push({line:line, sup:sup, item:null});
      }
    });
    return recs;
  }
  function qtyOf(rest){
    var m = rest.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
    if (!m) return null;
    return {n:parseFloat(m[1]), unitRaw:m[2].trim(), unit:m[2].replace(/^\(|\)$/g,'').trim()};
  }
  function fmt(n){ return String(Math.round(n * 100) / 100); }
  function balNum(v){
    if (v == null) return null;
    var x = String(v).replace(',', '.').trim();
    if (!x || isNaN(Number(x))) return null;
    return Number(x);
  }
  function minIndex(){
    var keys = {}, names = {}, unit = {};
    DAYS.forEach(function(d){
      scan(S.minmax[d]).forEach(function(r){
        if (!r.item) return;
        var q = qtyOf(r.item.rest); if (!q) return;
        var k = r.item.key; keys[k] = 1;
        if (!unit[k] && q.unit) unit[k] = q.unit;
        var nm = k.split('|')[1];
        names[nm] = names[nm] || [];
        if (names[nm].indexOf(k) < 0) names[nm].push(k);
      });
    });
    return {keys:keys, names:names, unit:unit};
  }
  function resolveKey(raw, idx){
    if (KEYALIAS[raw]) raw = KEYALIAS[raw];
    if (idx.keys[raw]) return raw;
    var c = idx.names[raw.split('|')[1]];
    return (c && c.length === 1) ? c[0] : raw;
  }
  function balByMinKey(idx){
    var out = {};
    Object.keys(BAL).forEach(function(raw){
      var n = balNum(BAL[raw]);
      if (n != null) out[resolveKey(raw, idx)] = n;
    });
    return out;
  }
  function balanceFilled0(text){
    var idx = minIndex();
    return scan(text).map(function(r){
      if (!r.item) return r.line;
      var v = BAL[r.item.key];
      if (v == null || String(v).trim() === '') return r.line;

        kids.push(itLowestPage());
      } else if (isub === 'balance'){
        kids.push(crumbs([{label:'Home', href:'#'}, {label:t('items'), href:'#items'}, {label:t('itbal')}]));
        kids.push(el('h2', {text:t('items') + ' · ' + t('itbal')}));
        if (!(ctx.editing && ctx.canEdit)) kids.push(itBalancePanel(function(){ paintItems(document.getElementById('sheet-text')); }));
        var ib = sheetView('itemsbal', t('itbal'), function(){ return S.items; }, function(v){ S.items = v; }, itBalText);
        var ipre = ib[0].querySelector('#sheet-text'); if (ipre) paintItems(ipre);
        ib.forEach(function(n){ kids.push(n); });
      } else {
        kids.push(crumbs([{label:'Home', href:'#'}, {label:t('items'), href:'#items'}, {label:t('order')}]));
        kids.push(el('h2', {text:t('items') + ' · ' + t('order')}));
        if (!(ctx.editing && ctx.canEdit)) kids.push(itOrderPanel(function(){ var pr = document.getElementById('sheet-text'); if (pr) pr.textContent = itOrderText(); }));
        sheetView('itemsorder', t('order'), function(){ return S.items; }, function(v){ S.items = v; }, itOrderText).forEach(function(n){ kids.push(n); });
      }
    } else if (r.sec === 'labels'){
      kids.push(crumbs([{label:'Home', href:'#'}, {label:t('lpage')}]));
      kids.push(el('h2', {text:t('lpage')}));
      if (ctx.isOwner) kids.push(labelsPage());
      else kids.push(el('p', {class:'hint', text:t('noperm')}));
    } else if (r.sec === 'salmon'){
      kids.push(crumbs([{label:'Home', href:'#'}, {label:t('salmon')}]));
      kids.push(el('h2', {text:t('salmon')}));
      var refreshSal = function(){ var pr = document.getElementById('sheet-text'); if (pr) pr.textContent = salmonFilled(S.salmon); };
      if (!(ctx.editing && ctx.canEdit)) kids.push(salmonPanel(refreshSal));
      sheetView('salmon', t('salmon'), function(){ return S.salmon; }, function(v){ S.salmon = v; }, function(){ return salmonFilled(S.salmon); }).forEach(function(n){ kids.push(n); });
    } else if (r.sec === 'schedule'){
      var s = supFromKey(r.key);
      if (!s){
        kids.push(crumbs([{label:'Home', href:'#'}, {label:'Ordering Schedule'}]));
        kids.push(el('h2', {text:t('schedule')}));
        var g2 = el('div', {class:'tiles'});
        supsNow().forEach(function(ss){ g2.appendChild(tile('#schedule-' + slug(ss), ss, '', true)); });
        kids.push(g2);
      } else {
        kids.push(crumbs([{label:'Home', href:'#'}, {label:'Ordering Schedule', href:'#schedule'}, {label:s}]));
        kids.push(el('h2', {text:s}));
        sheetView('sch' + s, s, function(){ return S.schedule[s]; }, function(v){ S.schedule[s] = v; }).forEach(function(n){ kids.push(n); });
      }
    }
    kids.push(el('div', {class:'status' + (ctx.err ? ' err' : ''), role:'status', text:ctx.status}));
    kids.forEach(function(k){ wrap.appendChild(k); });
    app.replaceChildren(wrap);
  }

  ctx.hash = location.hash;
  deepLink(location.hash);
  try { var so = sessionStorage.getItem('pngOutlet'); if (so && location.hash.length > 1 && R.outlets.indexOf(so) >= 0) setOutlet(so); } catch(e){}
  function go(h){
    if (h === '#outlets'){ setOutlet(null); h = ''; }
    if (deepLink(h)) h = ''; ctx.hash = h; ctx.showAdd = false; ctx.editing = false; ctx.status = ''; ctx.err = false;
    try { if (location.hash !== h) location.hash = h; } catch(e){}
    render(); try { window.scrollTo(0, 0); } catch(e){}
  }
  app.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a) return;
    ev.preventDefault();
    go(a.getAttribute('href') === '#' ? '' : a.getAttribute('href'));
  });
  window.addEventListener('hashchange', function(){ ctx.hash = location.hash; if (deepLink(location.hash)) ctx.hash = ''; ctx.editing = false; ctx.status = ''; ctx.err = false; render(); window.scrollTo(0, 0); });
  render();

  /* capabilities light up after first paint */
  (async function(){
    if (!window.claude || !window.claude.use) return;
    try {
      var u = await window.claude.use('user');
      if (u){
        ctx.plat = !!(await u.canEdit()); ctx.isOwner = !!(await u.isOwner());
        try { var me = await u.me(); ctx.email = String((me && me.email) || '').toLowerCase(); } catch(e2){}
      }
    } catch(e){}
    try { ctx.artifact = await window.claude.use('artifact'); } catch(e){}
    try { ctx.comments = await window.claude.use('comments'); } catch(e){}
    if (!ctx.artifact){ ctx.plat = false; ctx.isOwner = false; }
    ctx.ready = true;
    render();
  })();
})();
</script>

</body></html>
