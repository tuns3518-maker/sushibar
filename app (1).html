<title>Workplace Order System</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one narrow column of large tap targets; sheets shown as monospace text blocks that staff copy into chat. */
:root{
  --bg:#f1f3f5; --surface:#ffffff; --ink:#18202c; --muted:#5a6577; --line:#d6dbe3;
  --accent:#1d4d7a; --accent-ink:#ffffff; --tint:#e6eef6; --warn:#a8501c; --ok:#2b7a4b; --bad:#b3261e;
  --display:"Zen Kaku Gothic New","Noto Sans Myanmar","Noto Sans Devanagari","Noto Sans SC","Hiragino Sans","Noto Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --surface:#19202a; --ink:#e7ebf1; --muted:#9aa5b6; --line:#2b3441;
    --accent:#86b6e6; --accent-ink:#0e1824; --tint:#1e2a3a; --warn:#e0925a; --ok:#6fc193; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#19202a; --ink:#e7ebf1; --muted:#9aa5b6; --line:#2b3441;
  --accent:#86b6e6; --accent-ink:#0e1824; --tint:#1e2a3a; --warn:#e0925a; --ok:#6fc193; --bad:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--display); font-size:16px; line-height:1.5;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{min-height:36px;padding:6px 12px;font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.badge.edit{color:var(--ok);border-color:var(--ok)}
h1{font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:clamp(22px,5.5vw,28px);line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:15px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;padding:16px 18px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;
  transition:border-color .15s, background .15s;
}
.tile:hover{border-color:var(--accent);background:var(--tint)}
.tile .t{font-size:19px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile .go{font-size:20px;color:var(--accent);flex:none}
.tile.compact{min-height:64px;padding:12px 16px}
.tile.compact .t{font-size:17px}
.tile .pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 8px;flex:none}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.crumbs a{color:var(--accent);font-weight:700;padding:6px 0}
.crumbs a:hover{text-decoration:underline}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.sheet-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-bar:not(.nostick){position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--surface);border-radius:10px 10px 0 0}
.sheet-bar .note{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{
  font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:8px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.btnlink{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;text-decoration:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input.qty,textarea.txt{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
#bgfix{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none}
pre.txt,textarea.txt{
  display:block;width:100%;margin:0;padding:16px;border:0;background:transparent;color:var(--ink);
  font-family:var(--mono);font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;
  user-select:text;-webkit-user-select:text;
}
textarea.txt{font-size:16px;min-height:60vh;resize:vertical;border-radius:0 0 10px 10px}
textarea.txt:focus-visible{outline-offset:-3px}
.status{font-size:14px;color:var(--muted);min-height:20px}
.status.err{color:var(--warn)}
.hint{font-size:14px;color:var(--muted);margin:0;padding:12px 14px;background:var(--tint);border-radius:8px}
.req{display:flex;flex-direction:column;gap:8px;align-items:flex-start}


.h3{font-size:18px;margin:0;font-weight:700}
.panel{overflow:visible;overflow:clip}
.grp{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--tint);padding:8px 14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.frow .n,.orow .n{overflow-wrap:anywhere;min-width:0}
.hero{background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bgbar{display:flex;gap:8px;flex-wrap:wrap}
.frow.multi{grid-template-columns:minmax(0,1fr)}
.frow.multi .f{justify-content:flex-start;flex-wrap:wrap}
.frow .f{display:flex;align-items:center;gap:8px}
.frow .u{min-width:44px;font-size:13px;color:var(--muted)}
input.qty{font-family:var(--mono);font-size:16px;width:92px;min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
input.qty:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 92px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.orow .c{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:14px}
.orow.ohead{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-top:0}
.ord{font-weight:700;color:var(--accent)}
.ord.zero{color:var(--muted);font-weight:500}
.panel .hint{border-radius:0}
@media (max-width:520px){
  .orow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .orow .n{grid-column:1/-1}
  .orow .c{text-align:left}
  .orow .c::before{content:attr(data-label);display:block;font-family:var(--display);font-size:11px;color:var(--muted)}
  .orow.ohead{display:none}
}

.need{color:var(--bad);font-weight:700}
.tag{display:none;font-size:11px;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.frow.low .tag{display:inline-block}
.frow.low .n{color:var(--bad);font-weight:700}
input.qty.low{border-color:var(--bad);color:var(--bad)}
.ro{font-family:var(--mono);font-size:14px;text-align:right;min-width:44px}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}

    document.body.appendChild(ta);
    var ok = false;

  function copyFrom(text, pre, btn){
    var old = btn.textContent;
    var done = function(msg, ms){ btn.textContent = msg; setTimeout(function(){ btn.textContent = old; }, ms || 1600); };
    if (legacyCopy(text)){
      done(t('copied'));
      try { navigator.clipboard.writeText(text).catch(function(){}); } catch(e){}
      return;
    }
    var settled = false;
    var fail = function(){ if (settled) return; settled = true; selectNode(pre); done(t('selected'), 5000); };
    var timer = setTimeout(fail, 900);
    try {
      navigator.clipboard.writeText(text).then(function(){
        if (settled) return; settled = true; clearTimeout(timer); done(t('copied'));
      }, function(){ clearTimeout(timer); fail(); });
    } catch(e){ clearTimeout(timer); fail(); }
  }

  /* ---------- auto order: Order = Min-Max - Balance ---------- */
  var SUPLIST = ['XENKA','FOOTAH','LHS','TOHO','SENRI','BMG','GST','FOODAY','UGS','WAGYU','CENTRALKITCHEN','OUTLET'];
  var KEYALIAS = {

    'SENRI|mizkanponbottlezu':'SENRI|mizkanponzusauce',
    'SENRI|saikyomiso1kg':'SENRI|saikyomiso',
    'CENTRALKITCHEN|wasabidressing':'CENTRALKITCHEN|wasabidressingsauce'
  };
  var ITEM_RE = /^(\s*"?\s*(?:[A-Za-z]{1,3})?\d+\s*[\)\.]\s*)(.*?)(\s*:\s*)(.*)$/;
  function codeOf(prefix){ var m = String(prefix).match(/([A-Za-z]{1,3}\d+)/); return m ? m[1].toUpperCase() : ''; }
  function ikey(prefix, sup, name){ var c = codeOf(prefix); return c ? 'C:' + c : (sup ? sup + '|' : '') + canon(name); }
  function lineCode(l){ var m = String(l).match(/^\s*"?\s*([A-Za-z]{1,3}\d+)\s*[\)\.]/); return m ? m[1].toUpperCase() : ''; }
  function codesIn(text){ return String(text).split('\n').map(lineCode).filter(function(x){ return x; }); }
  ctx.orderDay = (new Date().getDay() + 6) % 7;
  function lsSuffix(){ return (!CUR.name || CUR.name === 'PNG' ? '' : '_' + CUR.name) + (CUR.inst ? '@' + CUR.inst : ''); }

  function headerOf(line){
    var L = line.toUpperCase().replace(/[^A-Z]/g,'');
    if (!L) return '';
    for (var i = 0; i < SUPLIST.length; i++){
      var sp = SUPLIST[i];
      if (L.indexOf(sp) === 0 && L.length <= sp.length + 3) return sp;
    }
    return '';
  }
  function supLabel(sp){ return sp === 'CENTRALKITCHEN' ? 'CENTRAL KITCHEN' : (sp === 'OUTLET' ? 'Outlet' : sp); }
  function scan(text){
    var sup = '', recs = [];
    String(text).split('\n').forEach(function(line){
      var m = line.match(ITEM_RE);
      if (m){
        var rest = m[4].replace(/"+\s*$/,'').trim();
        recs.push({line:line, sup:sup, item:{prefix:m[1], name:m[2], colon:m[3].replace(/\s+$/,''), rest:rest, key:ikey(m[1], sup, m[2])}});
      } else {

  function balNum(v){

        var k = r.item.key; keys[k] = 1;
        if (!unit[k] && q.unit) unit[k] = q.unit;
        if (k.indexOf('|') >= 0){

  function resolveKey(raw, idx){
    if (/^C:/.test(raw)) return raw;
    if (KEYALIAS[raw]) raw = KEYALIAS[raw];

  function codeLetterFor(text, path){

      var m = l.match(/^\s*"?\s*([A-Za-z]{1,3})\d+\s*[\)\.]/);
      if (m){ var k = m[1].toUpperCase(); cnt[k] = (cnt[k] || 0) + 1; }
    });
    var best = '', bn = 0;
    Object.keys(cnt).forEach(function(k){ if (cnt[k] > bn){ best = k; bn = cnt[k]; } });
    if (best) return best;
    var dm = path.match(/^(minmax|balance)(.+)$/);
    if (dm){ var i = DAYS.indexOf(dm[2]); if (i >= 0){ if (dm[1] === 'balance') i = (i + 1) % 7; return 'ABCDEFG'.charAt(i); } }
    if (/^standby/.test(path)) return 'S';
    if (/^items/.test(path)) return 'I';
    if (/^salmon/.test(path)) return 'F';
    return 'A';
  }

      var id = String(u.email).slice(0, -DOM.length);
      var s = await getDoc(doc(db, 'outlets', id));
      if (!s.exists()) return [];
      var d = s.data(); return [{id:id, name:d.name, data:d.data, tx:d.tx, bg:d.bg}];
    }
    var q = await getDocs(query(collection(db, 'outlets'), where('ownerUid', '==', u.uid)));
    var out = []; q.forEach(function(s){ var d = s.data(); out.push({id:s.id, name:d.name, data:d.data, tx:d.tx, bg:d.bg}); });
    return out;
  },
  saveOutlet: function(id, o){ return updateDoc(doc(db, 'outlets', id), clean(o)); },
  transferOutlet: async function(id, email){
    var q = await getDocs(query(collection(db, 'users'), where('email', '==', String(email).toLowerCase())));
    if (q.empty){ var e = new Error('no-user'); e.code = 'app/no-user'; throw e; }
    await updateDoc(doc(db, 'outlets', id), {ownerUid: q.docs[0].id});
  },
  createOutlet: async function(id, pw, o, ownerUid){
    var s = sec();
    try {
      var cred = await createUserWithEmailAndPassword(s.auth, id + DOM, pw);
      try {
        var body = clean(o); body.ownerUid = ownerUid; body.staffUid = cred.user.uid;
        await setDoc(doc(db, 'outlets', id), body);
        await setDoc(doc(db, 'outlets', id, 'private', 'cred'), {password:pw});
      } catch (e) {
        try { await deleteUser(cred.user); } catch (e2) {}
        throw e;
      }
    } finally { try { await deleteApp(s.app); } catch (e3) {} }
  },
  getStaffPw: async function(id){
    var s = await getDoc(doc(db, 'outlets', id, 'private', 'cred'));
    return s.exists() ? s.data().password : '';
  },
  changeStaffPw: async function(id, np){
    var old = await FB.getStaffPw(id), s = sec();
    try {
      var cred = await signInWithEmailAndPassword(s.auth, id + DOM, old);
      await updatePassword(cred.user, np);
      await setDoc(doc(db, 'outlets', id, 'private', 'cred'), {password:np});
    } finally { try { await deleteApp(s.app); } catch (e) {} }
  },
  deleteOutlet: async function(id){
    var old = ''; try { old = await FB.getStaffPw(id); } catch (e) {}
    if (old){
      var s = sec();
      try { var cred = await signInWithEmailAndPassword(s.auth, id + DOM, old); await deleteUser(cred.user); } catch (e) {}
      try { await deleteApp(s.app); } catch (e) {}
    }
    try { await deleteDoc(doc(db, 'outlets', id, 'private', 'cred')); } catch (e) {}
    await deleteDoc(doc(db, 'outlets', id));
  }
};
window.dispatchEvent(new Event('fbready'));
</script>
